name: Knowledge base routing checks

on:
  push:
    paths:
      - "aiops/kb.py"
      - "aiops/cli.py"
      - "aiops/tool_catalog.py"
      - "tests/test_kb.py"
      - "tests/test_registry.py"
      - "skills/knowledge-base-routing/**"
      - ".github/workflows/kb-validation.yml"
  pull_request:
    paths:
      - "aiops/kb.py"
      - "aiops/cli.py"
      - "aiops/tool_catalog.py"
      - "tests/test_kb.py"
      - "tests/test_registry.py"
      - "skills/knowledge-base-routing/**"
      - ".github/workflows/kb-validation.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q aiops
