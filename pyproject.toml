[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops"
version = "0.2.0"
description = "Local AI Ops: deterministic Python tools and local models that do the repeatable work, so LLM tokens go only to judgment and writing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
docs = ["pypdf>=4", "python-docx>=1"]
youtube = ["faster-whisper>=1", "pillow>=10"]
jobs = ["python-jobspy>=1.1"]
embeddings = ["sentence-transformers>=3"]
mcp = ["mcp>=1.2"]  # works with 1.x (FastMCP) and 2.x (MCPServer)
all = ["aiops[docs,youtube,jobs,embeddings,mcp]"]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
aiops = "aiops.cli:main"

[tool.setuptools.packages.find]
include = ["aiops*"]
